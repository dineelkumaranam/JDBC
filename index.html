<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div>
    <h1>Student Management System</h1>
    <p>Node.js + Express + Java MVC + JDBC + MySQL</p>
  </div>
</header>

<main>
<section class="card">
<h2>Add Student</h2>
<form id="studentForm">
  <div class="grid">
    <input name="name" placeholder="Student name" required>
    <input name="email" type="email" placeholder="Email" required>
    <input name="age" type="number" min="1" max="120" placeholder="Age" required>
    <input name="course" placeholder="Course" required>
    <input name="phone" placeholder="Phone">
  </div>
  <button type="submit">Save Student</button>
</form>
<p id="message"></p>
</section>

<section class="card">
<div class="toolbar">
  <h2>Student Records</h2>
  <input id="search" placeholder="Search by name or course...">
</div>
<div class="table-wrap">
<table>
<thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Age</th><th>Course</th><th>Phone</th><th>Actions</th></tr></thead>
<tbody id="studentTable"></tbody>
</table>
</div>
</section>
</main>
<script src="app.js"></script>
</body>
</html>
